[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-one-d-model"
version = "0.3.0"
description = "Motif-conditioned RNA scaffold sequence generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "torch>=2.1,<3",
  "lightning>=2.3",
  "wandb>=0.17",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
rnafm = ["rna-fm==0.2.2"]

[project.scripts]
rna-train-1d = "train:main"
rna-generate-scaffold = "generate_scaffold:main"
rna-validate-scaffolds = "validate_scaffolds:main"
rna-benchmark-scaffolds = "benchmark_scaffolds:main"

[tool.setuptools]
py-modules = ["train", "generate_scaffold", "validate_scaffolds", "benchmark_scaffolds"]

[tool.setuptools.packages.find]
include = ["rna_scaffold*"]

[tool.ruff]
line-length = 120
target-version = "py310"
