seed: 42
candidate_count: 256
bootstrap_samples: 10000
training_config: configs/train.yaml

# Every method uses the same <=100 nt canvas and the same asymmetric linker
# contract.  The short and long arms may appear on either side of the motif.
geometry:
  min_flank_length: 10
  min_total_scaffold_length: 29
  preferred_total_scaffold_length: 40
  max_length: 100
  short_flank_min: 10
  short_flank_max: 20
  long_flank_min: 15
  long_flank_max: 30

motif_panel:
  source_partition: test
  size: 48
  seed: 42
  motif_lengths: [4, 8, 16, 24, 30]
  min_flank_length: 10
  min_common_motifs_for_release: 20

smoke_motifs:
  - id: motif_gcgg
    sequence: GCGG
  - id: motif_augcga
    sequence: AUGCGA

methods:
  - name: uniform
    kind: uniform
  - name: markov1
    kind: markov1
  - name: markov2
    kind: markov2
  - name: transformer_linker_v5
    kind: checkpoint
    training_config: configs/train.yaml
    training_manifest: checkpoints_scaffold_linker_v5/training_manifest.json
    device: cuda
    primary: true
    expected_pretrained_kind: rna_fm
    expected_pretrained_mode: lora
    expected_decoder_mode: iterative_remasking
    expected_denoise_steps: 16
    generation:
      # Capability benchmark: no learned-only GC/run/diversity filtering.  The
      # constrained deployment recipe remains separate from this comparison.
      remask_strategy: random
      self_conditioning: 'off'
      denoise_steps: 16
      temperature: 1.0
      top_p: 1.0
      length_sampling: uniform
      short_flank_min: 10
      short_flank_max: 20
      long_flank_min: 15
      long_flank_max: 30

rnafold:
  enabled: false
  executable: RNAfold
  timeout_seconds: 30
  candidate_budget_per_motif: 256

output_dir: outputs/scaffold_benchmark_linker_v5
